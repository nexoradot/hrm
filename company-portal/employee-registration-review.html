<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA | Employee Registration Review</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script defer src="employee-registration-review.js"></script><style>

</style></head><body><header class="top"><strong>NEXORA · EMPLOYEE REGISTRATION REVIEW</strong><nav><a href="hrm.html">HR workspace</a> · <a href="employee-registration.html">Registration form</a></nav></header><main class="wrap"><h1>Employee onboarding submissions</h1><p>Confidential records. Access is restricted to authorised HR managers and platform administrators.</p><div id="message" class="notice hidden" role="status"></div><section id="auth" class="panel"><form id="login"><label>Email <input name="email" type="email" required></label> <label>Password <input name="password" type="password" required></label> <button class="btn">Sign in</button></form></section><section id="app" class="hidden"><div class="panel"><div class="toolbar"><select id="org"></select><select id="status"><option value="">All statuses</option><option>submitted</option><option>under_review</option><option>needs_changes</option><option>approved</option><option>rejected</option></select><button id="refresh" class="btn ghost">Refresh</button><button id="logout" class="btn ghost">Sign out</button></div><div id="rows" class="tablewrap"></div></div><div id="detail" class="panel hidden"></div></section></main></body></html>
